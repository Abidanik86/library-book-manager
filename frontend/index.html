<!DOCTYPE html>
<html lang="en" ng-app="libraryApp" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Book Manager</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem("library_theme");
        var preferred =
          saved ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-bs-theme", preferred);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body ng-controller="ThemeController as themeVm">
  <header class="app-navbar sticky-top">
    <div class="container py-2 py-sm-3 d-flex align-items-center justify-content-between gap-2 gap-sm-3">
      <a href="#!/books" class="brand-link d-flex align-items-center gap-2 text-decoration-none min-w-0">
        <span class="brand-icon d-inline-flex align-items-center justify-content-center flex-shrink-0">
          <i class="bi bi-journal-bookmark-fill"></i>
        </span>
        <div class="min-w-0">
          <span class="brand-title d-block text-truncate">Library Manager</span>
          <span class="brand-subtitle d-none d-sm-block">Catalog &amp; Circulation</span>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2 flex-shrink-0">
        <button
          type="button"
          class="btn theme-toggle-btn d-inline-flex align-items-center justify-content-center flex-shrink-0"
          ng-click="themeVm.toggleTheme()"
          aria-label="Toggle color theme"
          title="{{ themeVm.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode' }}"
        >
          <i class="bi" ng-class="themeVm.theme === 'dark' ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill'"></i>
        </button>

        <a
          href="#!/books/new"
          class="btn btn-primary btn-sm px-2 px-sm-3 py-2 fw-medium d-inline-flex align-items-center gap-1 gap-sm-2 flex-shrink-0"
        >
          <i class="bi bi-plus-lg"></i>
          <span class="d-none d-sm-inline">Add Book</span>
          <span class="d-sm-none">Add</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container py-3 py-sm-4">
    <div ng-view></div>
  </main>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>

  <script src="app/app.module.js"></script>
  <script src="app/services/book.service.js"></script>
  <script src="app/controllers/book-list.controller.js"></script>
  <script src="app/controllers/book-form.controller.js"></script>
</body>
</html>
